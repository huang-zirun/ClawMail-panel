<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawMail 收件箱</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>ClawMail 收件箱</h1>
        {% if emails %}
        <table>
            <thead>
                <tr>
                    <th>账号</th>
                    <th>时间</th>
                    <th>发件人</th>
                    <th>主题</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody>
                {% for email in emails %}
                <tr class="{% if not email.is_read %}unread{% endif %}" onclick="location.href='/mail/{{ email.id }}'">
                    <td>{{ email.account_name or '' }}</td>
                    <td>{{ email.date_text or '' }}</td>
                    <td>{{ email.sender or '' }}</td>
                    <td>{{ email.subject or '' }}</td>
                    <td class="{% if not email.is_read %}status-unread{% else %}status-read{% endif %}">{% if not email.is_read %}未读{% else %}已读{% endif %}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="empty">暂无邮件</p>
        {% endif %}
    </div>
</body>
</html>
